name: release

# 打 tag 触发：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 一次构建 universal（arm64 + x86_64）
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/pk-gui/frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 打包依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: 安装前端依赖
        working-directory: crates/pk-gui/frontend
        run: pnpm install --frozen-lockfile

      - name: 构建并发布 GUI 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/pk-gui
          tagName: ${{ github.ref_name }}
          releaseName: "端口终结者 v__VERSION__"
          releaseBody: "下载对应平台安装包；命令行工具 pk 见 pk-v* 压缩包。"
          # 草稿模式：构建完成确认无误后手动发布
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: 打包并上传 pk CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p pk ${{ matrix.args }}
          TAG="${GITHUB_REF_NAME}"
          case "${{ matrix.platform }}" in
            macos-latest)
              ART="pk-${TAG}-universal-apple-darwin.tar.gz"
              tar -czf "$ART" -C target/universal-apple-darwin/release pk
              ;;
            windows-latest)
              ART="pk-${TAG}-x86_64-pc-windows-msvc.zip"
              tar -a -cf "$ART" -C target/release pk.exe
              ;;
            *)
              ART="pk-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
              tar -czf "$ART" -C target/release pk
              ;;
          esac
          gh release upload "$TAG" "$ART" --clobber
