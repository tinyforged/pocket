name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # 跨平台编译是本机唯一验证不了的东西，所以三平台都跑
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # pk-gui 前端：pnpm（版本读自 package.json 的 packageManager 字段）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/pk-gui/frontend/pnpm-lock.yaml

      # @rev 即工具链版本，与 rust-toolchain.toml 保持一致
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # pk-gui（Tauri）在 Linux 上需要 webview / gtk 开发库才能编译
      - name: 安装 GUI 的 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      # tauri 在编译期嵌入 frontend/dist，先于所有 cargo 步骤构建
      - name: 构建前端
        working-directory: crates/pk-gui/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all
