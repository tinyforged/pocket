<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>端口终结者</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo">⚡</div>
          <div class="brand-text">
            <h1>端口终结者</h1>
            <p class="sub">pk · 谁占了端口，一眼看清，一键送走</p>
          </div>
        </div>
        <div class="controls">
          <div class="search">
            <span class="search-icon">⌕</span>
            <input id="search" type="text" placeholder="端口 / 进程名 / 用户，按 / 聚焦" autocomplete="off" />
          </div>
          <label class="auto-refresh" title="每 4 秒自动刷新占用列表">
            <input id="auto" type="checkbox" />
            <span>自动刷新</span>
          </label>
          <button id="refresh" class="btn ghost">↻ 刷新</button>
        </div>
      </header>

      <main id="main">
        <div class="row head">
          <span class="c-port">端口</span>
          <span class="c-proto">协议</span>
          <span class="c-addr">地址</span>
          <span class="c-state">状态</span>
          <span class="c-proc">进程</span>
          <span class="c-act"></span>
        </div>
        <div id="rows"></div>
        <div id="empty" class="empty" hidden>
          <div class="empty-icon">🎉</div>
          <p>当前没有端口被占用</p>
        </div>
      </main>

      <footer class="statusbar">
        <span id="stats">加载中…</span>
        <span class="tip">终止顺序：SIGTERM → 3s 宽限 → SIGKILL</span>
      </footer>
    </div>

    <div id="modal" class="modal-mask" hidden>
      <div id="modal-card" class="modal">
        <h2 id="m-title">终止进程</h2>
        <p id="m-text" class="m-text"></p>
        <ul id="m-list" class="m-list"></ul>
        <label id="m-ack" class="m-ack" hidden>
          <input type="checkbox" id="m-check" />
          <span>我已知晓这是<b>受保护进程</b>，终止它可能导致数据丢失或开发环境损坏</span>
        </label>
        <div class="m-actions">
          <button id="m-cancel" class="btn ghost">取消</button>
          <button id="m-confirm" class="btn danger">确认终止</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
