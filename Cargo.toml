[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pk-core = { path = "crates/pk-core" }
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
sysinfo = "0.39"
netstat2 = "0.11"
serde = { version = "1", features = ["derive"] }
tauri = "2"
tauri-build = "2"

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
